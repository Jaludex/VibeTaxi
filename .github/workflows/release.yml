name: Build and Release VibeTaxi

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            channel: windows
          - os: ubuntu-latest
            channel: linux
          - os: macos-latest
            channel: osx

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build with PyInstaller
      working-directory: vibetaxi
      run: pyinstaller main.spec

    - name: Zip build (Windows)
      if: matrix.os == 'windows-latest'
      working-directory: vibetaxi
      run: Compress-Archive -Path dist/main/* -DestinationPath "../VibeTaxi-${{ github.ref_name }}-Windows.zip"

    - name: Zip build (Linux)
      if: matrix.os == 'ubuntu-latest'
      working-directory: vibetaxi
      run: |
        cd dist/main
        zip -r "../../../VibeTaxi-${{ github.ref_name }}-Linux.zip" .

    - name: Zip build (macOS)
      if: matrix.os == 'macos-latest'
      working-directory: vibetaxi
      run: |
        cd dist
        zip -r -y "../../VibeTaxi-${{ github.ref_name }}-macOS.zip" VibeTaxi.app

    - name: Upload Release to GitHub
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: VibeTaxi-*.zip
        generate_release_notes: false

    # ITCH.IO BUTLER
    - name: Push to Itch.io
      uses: manleydev/butler-publish-itchio-action@master
      env:
        BUTLER_CREDENTIALS: ${{ secrets.BUTLER_API_KEY }}
        ITCH_USER: jaludex
        ITCH_GAME: vibe-taxi
        CHANNEL: ${{ matrix.channel }}
        PACKAGE: ${{ matrix.os == 'macos-latest' && 'vibetaxi/dist/VibeTaxi.app' || 'vibetaxi/dist/main' }}
        VERSION: ${{ github.ref_name }}